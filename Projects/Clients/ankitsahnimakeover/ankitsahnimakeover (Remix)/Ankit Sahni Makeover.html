<script>
// Add hamburger menu - use MutationObserver for robustness
document.addEventListener('DOMContentLoaded', function() {
  const addMenuButton = () => {
    const navRight = document.querySelector('.nav-right');
    const navCenter = document.querySelector('.nav-center');
    if (!navRight || !navCenter || document.querySelector('.nav-menu-btn')) return;

    const menuBtn = document.createElement('button');
    menuBtn.className = 'nav-menu-btn';
    menuBtn.setAttribute('aria-label', 'Toggle menu');
    menuBtn.innerHTML = '<span></span><span></span><span></span>';
    menuBtn.addEventListener('click', (e) => {
      e.preventDefault();
      navCenter.classList.toggle('open');
    });

    navCenter.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navCenter.classList.remove('open');
      });
    });

    navRight.insertBefore(menuBtn, navRight.firstChild);
  };

  // Immediate attempt
  addMenuButton();

  // If React hasn't rendered yet, wait for it
  if (!document.querySelector('.nav-menu-btn')) {
    setTimeout(addMenuButton, 100);
    setTimeout(addMenuButton, 500);
    setTimeout(addMenuButton, 1500);
  }
});
</script>
